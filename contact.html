          <p class="page-header__tagline">For bookings, collaborations, or just to say hello.</p>
        </header>
      </div>

      <div class="content-wrap">
        <div class="contact-form-wrap fade-in">

          <!-- Netlify handles this form for free — no backend needed. Submissions appear in your Netlify dashboard. -->
          <form class="contact-form" name="contact" method="POST" data-netlify="true" netlify>
            <input type="hidden" name="form-name" value="contact">
            <input type="text" name="name" placeholder="Your name" required>
            <input type="email" name="email" placeholder="your@email.com" required>
            <select name="subject" required>
              <option value="" disabled selected>Subject</option>
              <option value="Booking">Booking</option>
              <option value="Collaboration">Collaboration</option>
              <option value="Photography">Photography</option>
              <option value="Other">Other</option>
            </select>
            <textarea name="message" rows="6" placeholder="What's on your mind?" required></textarea>
            <button type="submit" class="contact-form__submit">Send Message</button>
          </form>

          <div id="form-success">
            <p>Thanks! I'll be in touch soon.</p>
          </div>
